[platformio]
src_dir = .cardenza-build

[env:cardputer]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
; This sketch uses Bluedroid GAP APIs, unavailable in Arduino 3.3.9's S3 NimBLE SDK.
platform_packages =
    framework-arduinoespressif32 @ https://github.com/espressif/arduino-esp32/releases/download/3.2.0/esp32-3.2.0.zip
    framework-arduinoespressif32-libs @ https://github.com/espressif/esp32-arduino-lib-builder/releases/download/idf-release_v5.4/esp32-arduino-libs-idf-release_v5.4-2f7dcd86-v1.zip
board = m5stack-stamps3
framework = arduino
lib_compat_mode = strict
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = huge_app.csv
extra_scripts = pre:support/prepare_sketch.py
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ; libssh declares generic SD; select the ESP32 core's SD implementation.
    symlink://${sysenv.PLATFORMIO_CORE_DIR}/packages/framework-arduinoespressif32/libraries/SD
    m5stack/M5Cardputer@^1.1.1
    m5stack/M5Unified@^0.2.17
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.4.2
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.6.0
    https://github.com/dvarrel/ESPping.git
    https://github.com/stevemarple/IniFile.git
    earlephilhower/ESP8266Audio@2.3.0
    https://github.com/ewpa/LibSSH-ESP32.git
monitor_speed = 115200


; Use this guarded artifact for startup/menu hardware verification.
[env:cardputer-menu-test]
extends = env:cardputer
build_flags =
    ${env:cardputer.build_flags}
    -DEVIL_MENU_ONLY
    -Wl,--wrap=esp_wifi_start
    -Wl,--wrap=esp_wifi_set_promiscuous
    -Wl,--wrap=esp_wifi_80211_tx

[env:cardenza]
extends = env:cardputer
board_build.partitions = cardenza-partitions.csv
lib_deps =
    ; libssh declares generic SD; select the ESP32 core's SD implementation.
    symlink://${sysenv.PLATFORMIO_CORE_DIR}/packages/framework-arduinoespressif32/libraries/SD
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.22
    mikalhart/TinyGPSPlus@^1.0.3
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.4.2
    ESP32Async/AsyncTCP@^3.3.2
    ESP32Async/ESPAsyncWebServer@^3.6.0
    https://github.com/dvarrel/ESPping.git
    https://github.com/stevemarple/IniFile.git
    earlephilhower/ESP8266Audio@2.3.0
    https://github.com/ewpa/LibSSH-ESP32.git
    m5stack/M5GFX@0.2.31
build_flags =
    ${env:cardputer.build_flags}
    -Wl,--wrap=esp_partition_erase_range
    -DCARDENZA_TARGET
    -Wl,--wrap=_ZN2m511Power_Class5beginEv
    -Wl,--wrap=_ZN2m59M5Unified10_setup_ledEN4lgfx6boards7board_tE

[env:cardenza-menu-test]
extends = env:cardenza
build_flags =
    ${env:cardenza.build_flags}
    -DEVIL_MENU_ONLY
    -Wl,--wrap=esp_wifi_start
    -Wl,--wrap=esp_wifi_set_promiscuous
    -Wl,--wrap=esp_wifi_80211_tx
